<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVault // Web Interface</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#0f172a',
                            panel: '#1e293b',
                            accent: '#10b981', 
                            blue: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="p-4">

    <div class="mb-8 text-center">
        <h1 class="text-4xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500">
            PIXELVAULT
        </h1>
        <p class="text-slate-400 mt-2 text-sm uppercase tracking-widest">Steganography Operations Console</p>
    </div>

    <div class="glass-panel w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[500px]">
        
        <div class="w-full md:w-64 bg-slate-900/50 p-6 flex flex-col gap-4 border-r border-slate-700/50">
            <button onclick="switchTab('encode')" id="btn-tab-encode" 
                class="flex items-center gap-3 px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 transition-all border-l-4 border-emerald-500 text-white shadow-lg">
                <span>🔒</span> Encode (Hide)
            </button>
            <button onclick="switchTab('decode')" id="btn-tab-decode" 
                class="flex items-center gap-3 px-4 py-3 rounded-xl bg-transparent hover:bg-slate-800 transition-all border-l-4 border-transparent text-slate-400">
                <span>🔓</span> Decode (Find)
            </button>
        </div>

        <div class="flex-1 p-8 relative">
            
            <div id="section-encode" class="space-y-6">
                <h2 class="text-2xl font-bold text-emerald-400 mb-6">Encrypt & Hide Data</h2>
                
                <form id="form-encode" class="space-y-4">
                    <div class="drop-zone relative rounded-xl p-8 text-center cursor-pointer group" id="drop-cover">
                        <input type="file" name="cover_image" id="input-cover" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept="image/png, image/jpeg, image/bmp" required>
                        <div class="text-slate-400 group-hover:text-emerald-300 transition-colors">
                            <div class="text-4xl mb-2">🖼️</div>
                            <p class="font-medium">Click or Drag Cover Image</p>
                            <p class="text-xs text-slate-500" id="name-cover">Supported: PNG, JPG, BMP</p>
                        </div>
                    </div>

                    <div class="drop-zone relative rounded-xl p-8 text-center cursor-pointer group" id="drop-secret">
                        <input type="file" name="secret_file" id="input-secret" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                        <div class="text-slate-400 group-hover:text-emerald-300 transition-colors">
                            <div class="text-4xl mb-2">📄</div>
                            <p class="font-medium">Click or Drag Secret File</p>
                            <p class="text-xs text-slate-500" id="name-secret">Supported: PDF, TXT, Any</p>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-4 rounded-xl shadow-lg transform transition-all hover:scale-[1.01] flex justify-center items-center gap-2">
                        <span id="btn-text-enc">EXECUTE STEGANOGRAPHY</span>
                        <div id="loader-enc" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    </button>
                </form>
            </div>

            <div id="section-decode" class="hidden space-y-6">
                <h2 class="text-2xl font-bold text-blue-400 mb-6">Extract Hidden Data</h2>
                
                <form id="form-decode" class="space-y-4">
                    <div class="drop-zone relative rounded-xl p-12 text-center cursor-pointer group" id="drop-stego">
                        <input type="file" name="stego_image" id="input-stego" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept="image/png" required>
                        <div class="text-slate-400 group-hover:text-blue-300 transition-colors">
                            <div class="text-4xl mb-4">🕵️‍♀️</div>
                            <p class="font-medium text-lg">Click or Drag Encoded Image</p>
                            <p class="text-xs text-slate-500 mt-2" id="name-stego">Must be the PNG output from PixelVault</p>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg transform transition-all hover:scale-[1.01] flex justify-center items-center gap-2">
                        <span id="btn-text-dec">RETRIEVE DATA</span>
                        <div id="loader-dec" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-hidden fixed bottom-5 right-5 bg-slate-800 border border-slate-600 px-6 py-4 rounded-xl shadow-2xl transition-all duration-300 flex items-center gap-3">
        <div id="toast-icon"></div>
        <div id="toast-msg" class="text-sm font-medium"></div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
